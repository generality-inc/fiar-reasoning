[project]
name = "fiar"
version = "1.0.0"
description = "Extracting search trees from LLM reasoning traces in four-in-a-row"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "graphviz>=0.21",
    "ipykernel>=7.2.0",
    "json-repair>=0.25",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openai>=1.0",
    "pandas>=3.0.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Re-running the intervention models with edited traces (CUDA GPUs).
gpu = [
    "transformers>=4.40",
    "vllm>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fiar"]
